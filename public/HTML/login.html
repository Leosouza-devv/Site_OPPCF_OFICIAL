<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login / Cadastro</title>
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="form-login">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-senha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p>Não tem conta? <a href="#" onclick="alternar('cadastro')">Cadastre-se</a></p>
    <p id="msg-login"></p>
  </div>

  <!-- CADASTRO -->
  <div id="form-cadastro" style="display: none;">
    <h2>Cadastro</h2>
    <input type="text" id="cad-nome" placeholder="Nome">
    <input type="email" id="cad-email" placeholder="Email">
    <input type="password" id="cad-senha" placeholder="Senha">
    <input type="number" id="cad-idade" placeholder="Idade">
    <button onclick="cadastrar()">Cadastrar</button>
    <p>Já tem conta? <a href="#" onclick="alternar('login')">Entrar</a></p>
    <p id="msg-cadastro"></p>
  </div>

  <script src="../JS/login.js"></script>
</body>
</html>
